genome_wide:
  - id: wgs_human
    label: "WGS (Human)"
    region_bp: 3300000000
    duplication_pct: 2.5
    on_target_pct: 100

  - id: exome_human
    label: "Exome (Human)"
    region_bp: 50000000
    duplication_pct: 15.0
    on_target_pct: 80

  - id: bacterial_wgs
    label: "Bacterial WGS"
    region_bp: 5000000
    duplication_pct: 2.0
    on_target_pct: 100

  - id: shotgun_metagenomics
    label: "Shotgun metagenomics"
    # Shotgun metagenomics is planned by data volume per sample, not
    # coverage of a single 500 bp marker.
    region_bp: 1
    duplication_pct: 1.0
    on_target_pct: 100
    gb_per_sample: 5.0

  - id: ddrad
    label: "ddRAD (Reduced representation)"
    region_bp: 0
    duplication_pct: 5.0
    on_target_pct: 100
    target_fraction_pct: 2.0

targeted:
  - id: amplicon_panel
    label: "Amplicon Panel (AmpliSeq)"
    region_bp: 400000
    duplication_pct: 10.0
    on_target_pct: 90
    amplicon_count: 1380
    min_reads_per_amplicon: 500
    amplicon_imbalance_factor: 3.0

  - id: marker_amplicon
    label: "16S / ITS / marker amplicon"
    region_bp: 500
    duplication_pct: 1.0
    on_target_pct: 100
    amplicon_count: 1
    min_reads_per_amplicon: 10000
    amplicon_imbalance_factor: 1.5
